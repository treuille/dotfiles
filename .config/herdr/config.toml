onboarding = false
[theme]
name = "catppuccin"
auto_switch = false

# Hide unfocused pane borders: match them to the pane background
# (catppuccin mocha base) so only the focused accent border shows
[theme.custom]
surface_dim = "#1e1e2e"

[ui]
show_agent_labels_on_pane_borders = true
pane_borders = true
pane_gaps = false

agent_panel_sort = "spaces"
[ui.sidebar.agents]
rows = [["state_icon", "workspace", "tab"], ["terminal_title_stripped"], ["agent"]]

[ui.toast]
delivery = "herdr"

[keys]
# Workspace-first numbering: prefix+N jumps to workspace, shift for tabs
switch_workspace = "prefix+1..9"
switch_tab = "prefix+shift+1..9"
# Cycle tabs without the prefix; workspaces behind the prefix
# (swapped from the defaults: tab cycling is the more frequent move)
next_tab = "alt+n"
previous_tab = "alt+p"
next_workspace = "prefix+n"
previous_workspace = "prefix+p"
# Vertical split (side by side): keep default prefix+v, add direct alt+w
split_vertical = ["prefix+v", "alt+w"]
# Zoom (fullscreen pane): keep default prefix+z, add direct alt+z
zoom = ["prefix+z", "alt+z"]
# Navigate mode: prefixed and direct
goto = ["prefix+g", "alt+g"]
# Sidebar toggle: prefix only — direct alt+b fired too easily
toggle_sidebar = "prefix+b"
# Vim-style pane navigation (Alt+hjkl), as in tmux config
focus_pane_left = "alt+h"
focus_pane_down = "alt+j"
focus_pane_up = "alt+k"
focus_pane_right = "alt+l"
# Swap pane in direction (Alt+Shift+hjkl)
swap_pane_left = "alt+shift+h"
swap_pane_down = "alt+shift+j"
swap_pane_up = "alt+shift+k"
swap_pane_right = "alt+shift+l"

# tmux-style mark + swap: alt+m / prefix+m toggles a mark on the
# active pane ("(marked) ..." title); alt+s / prefix+s swaps the
# active pane with the marked one (cross-tab supported via move
# emulation) and unmarks. Scripts: dotfiles/bin/herdr-mark and
# dotfiles/bin/herdr-swap-marked, symlinked into ~/.local/bin.
[[keys.command]]
key = "alt+m"
type = "shell"
command = "herdr-mark"
description = "toggle mark on pane"

[[keys.command]]
key = "prefix+m"
type = "shell"
command = "herdr-mark"
description = "toggle mark on pane"

[[keys.command]]
key = "alt+s"
type = "shell"
command = "herdr-swap-marked"
description = "swap with marked pane"

[[keys.command]]
key = "prefix+s"
type = "shell"
command = "herdr-swap-marked"
description = "swap with marked pane"

# tmux-style even-horizontal: equalize column widths in the focused
# tab (only left/right splits touched; vertical stacks untouched).
# Script: dotfiles/bin/herdr-equalize, symlinked into ~/.local/bin.
[[keys.command]]
key = "alt+e"
type = "shell"
command = "herdr-equalize"
description = "equalize pane widths"

[[keys.command]]
key = "prefix+e"
type = "shell"
command = "herdr-equalize"
description = "equalize pane widths"
